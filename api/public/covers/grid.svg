<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title>Geometric grid</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="lines" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#93c5fd" stroke-opacity=".2" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#base)"/>
  <rect width="1200" height="630" fill="url(#lines)"/>
  <circle cx="860" cy="220" r="190" fill="#22d3ee" fill-opacity=".25"/>
  <circle cx="240" cy="490" r="250" fill="#a78bfa" fill-opacity=".25"/>
</svg>
